name: Android Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/example/ridmikkeyboard
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable
          
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/
          [ -f RidmikKeyboardService.kt ] && mv RidmikKeyboardService.kt app/src/main/java/com/example/ridmikkeyboard/
          [ -f res/layout/keyboard_view.xml ] && mv res/layout/keyboard_view.xml app/src/main/res/layout/
          [ -f res/layout/key_view.xml ] && mv res/layout/key_view.xml app/src/main/res/layout/
          [ -f res/xml/method.xml ] && mv res/xml/method.xml app/src/main/res/xml/
          [ -f res/drawable/key_background.xml ] && mv res/drawable/key_background.xml app/src/main/res/drawable/

          cat << 'EOF' > settings.gradle
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.0.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.ridmikkeyboard'
              compileSdk 33

              defaultConfig {
                  applicationId "com.example.ridmikkeyboard"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.9.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.8.0'
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0.2'

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ridmik-Ultimate-Keyboard-APK
          path: app/build/outputs/apk/debug/*.apk
