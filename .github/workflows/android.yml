
name: Build Ridmik Ultimate Android Keyboard

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GRADLE_VERSION: 8.0.2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.0.2
        shell: bash
        run: |
          set -euo pipefail

          GRADLE_DIR="$RUNNER_TEMP/gradle"
          GRADLE_ARCHIVE="$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip"

          mkdir -p "$GRADLE_DIR"

          wget --https-only --timeout=30 --tries=3 \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -O "$GRADLE_ARCHIVE"

          unzip -q "$GRADLE_ARCHIVE" -d "$GRADLE_DIR"

          echo "$GRADLE_DIR/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          rm -f "$GRADLE_ARCHIVE"

      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          test "$JAVA_HOME" != ""

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager -perm /111 \
              -print -quit 2>/dev/null || true)"
          fi

          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::Android SDK sdkmanager was not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses \
            || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          mkdir -p "$GITHUB_WORKSPACE"

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" \
            > "$GITHUB_WORKSPACE/local.properties"

      - name: Generate Android project files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            app/src/main/java/com/example/ridmikkeyboard \
            app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Ridmik Ultimate"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.0.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.8.20' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.ridmikkeyboard'
              compileSdk 33

              defaultConfig {
                  applicationId 'com.example.ridmikkeyboard'
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }

              buildTypes {
                  debug {
                      applicationIdSuffix '.debug'
                      versionNameSuffix '-debug'
                  }

                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.10.1'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.9.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="false"
                  android:label="Ridmik Ultimate"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <service
                      android:name=".RidmikKeyboardService"
                      android:label="Ridmik Ultimate"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>

                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>

              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/method.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:isDefault="false"
              android:supportsSwitchingToNextInputMethod="true">

              <subtype
                  android:label="English"
                  android:imeSubtypeLocale="en_US"
                  android:imeSubtypeMode="keyboard" />

          </input-method>
          EOF

          cat > app/src/main/java/com/example/ridmikkeyboard/RidmikKeyboardService.kt <<'EOF'
          package com.example.ridmikkeyboard

          import android.inputmethodservice.InputMethodService
          import android.view.View
          import android.view.inputmethod.EditorInfo
          import android.widget.Button
          import android.widget.LinearLayout

          class RidmikKeyboardService : InputMethodService() {

              override fun onCreateInputView(): View {
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(8, 8, 8, 8)
                  }

                  val button = Button(this).apply {
                      text = "Ridmik Ultimate"
                      isAllCaps = false
                      setOnClickListener {
                          currentInputConnection?.commitText("Hello", 1)
                      }
                  }

                  layout.addView(
                      button,
                      LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      )
                  )

                  return layout
              }

              override fun onStartInput(
                  attribute: EditorInfo?,
                  restarting: Boolean
              ) {
                  super.onStartInput(attribute, restarting)
              }
          }
          EOF

          mkdir -p app/src/main/res/values

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme"
                  parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#008577</item>
              </style>
          </resources>
          EOF

      - name: Validate generated files
        shell: bash
        run: |
          set -euo pipefail

          test -f local.properties
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/xml/method.xml
          test -f app/src/main/java/com/example/ridmikkeyboard/RidmikKeyboardService.kt
          test -f app/src/main/res/values/styles.xml

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle --no-daemon --stacktrace \
            --warning-mode all \
            clean :app:assembleDebug

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK_PATH" ]]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ridmik-ultimate-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
