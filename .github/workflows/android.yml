name: Android Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android Project Structure & Files
        run: |
          mkdir -p app/src/main/java/com/example/ridmikkeyboard
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable
          
          # Move existing files if present, otherwise safe defaults will be created
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/ || echo "Manifest will be generated"
          
          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="Ridmik Ultimate">
                  <service
                      android:name=".RidmikKeyboardService"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.view.InputMethodService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
              </application>
          </manifest>
          EOF
          fi

          [ -f RidmikKeyboardService.kt ] && mv RidmikKeyboardService.kt app/src/main/java/com/example/ridmikkeyboard/ || echo "Kotlin service will be generated"
          
          if [ ! -f app/src/main/java/com/example/ridmikkeyboard/RidmikKeyboardService.kt ]; then
            cat << 'EOF' > app/src/main/java/com/example/ridmikkeyboard/RidmikKeyboardService.kt
          package com.example.ridmikkeyboard

          import android.inputmethodservice.InputMethodService
          import android.view.View

          class RidmikKeyboardService : InputMethodService() {
              override fun onCreateInputView(): View {
                  return View(this)
              }
          }
          EOF
          fi

          if [ ! -f app/src/main/res/xml/method.xml ]; then
            cat << 'EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android" />
          EOF
          fi

          cat << 'EOF' > settings.gradle
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.0.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.ridmikkeyboard'
              compileSdk 33

              defaultConfig {
                  applicationId "com.example.ridmikkeyboard"
                  minSdk 21
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.9.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.8.0'
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.0.2'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ridmik-Ultimate-Keyboard-APK
          path: app/build/outputs/apk/debug/*.apk
